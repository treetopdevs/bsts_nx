name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      run_r_parity:
        description: "Run R parity integration test job"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "28"

    env:
      MIX_ENV: test
      # Pin the full suite to the BinaryBackend. The test helper defaults to
      # EMLX whenever its NIF loads, but MLX on Linux CPU raises an uncaught
      # std::runtime_error (sgetrf on a singular matrix) that aborts the
      # whole VM mid-suite. EXLA coverage runs in the test_exla job below.
      BSTS_NX_TEST_BACKEND: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EMLX 0.3's NIF links against OpenBLAS, which the runner image does
      # not ship; without it the emlx application fails to start and
      # `mix test` aborts before running anything. NumPy backs the Python
      # comparison tests, which fail (rather than skip) when it is absent.
      - name: Install EMLX runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas0 python3-numpy

      - name: Setup Elixir + OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --exclude external

  test_exla:
    name: Test EXLA (Elixir 1.19 / OTP 28)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      BSTS_NX_TEST_BACKEND: exla

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the test job: emlx still starts as an application even when the
      # suite runs on EXLA, and its NIF needs OpenBLAS to load.
      - name: Install EMLX runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas0

      - name: Setup Elixir + OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-exla-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-exla-1.19-28-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run EXLA smoke tests
        run: mix test test/structured_performance_smoke_test.exs test/utils_safe_solve_test.exs

  quality:
    name: Quality (Elixir 1.19 / OTP 28)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir + OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-quality-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-1.19-28-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Build docs
        run: mix docs

  r_parity:
    name: R parity (Elixir 1.19 / OTP 28)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_r_parity == true }}

    env:
      MIX_ENV: test
      BSTS_NX_ENABLE_R_PARITY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir + OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R package dependencies
        run: |
          Rscript -e "install.packages('bsts', repos = 'https://cloud.r-project.org')"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-r-parity-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-r-parity-1.19-28-

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run R parity integration
        run: mix test test/r_parity_test.exs
